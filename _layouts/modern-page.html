---
layout: modern
---

<article class="modern-page site-shell">
  <header class="page-intro">
    {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p>{{ page.description }}</p>{% endif %}
  </header>
  <div class="modern-page__content">
    {{ content }}
  </div>
</article>
